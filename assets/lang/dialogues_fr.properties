TUTO_FLOOR_1_INTRO_1=\nLe groupe arrive dans une sombre cave qui sent le rat mort...
TUTO_FLOOR_1_INTRO_2=\nRanger : "Bon les gars, le tavernier a dit que les rats géants pillaient sa réserve de bière."
TUTO_FLOOR_1_INTRO_3=\nElfe : "Oh non ! Ça a l'air sale et ça sent mauvais !"
TUTO_FLOOR_1_INTRO_4=\nOgre : "Burp !"
TUTO_FLOOR_1_INTRO_5=\nRanger : "Allez, avancez ! Et touchez à rien !"

TUTO_FLOOR_2_ELF_DEAD_1=\nRanger : "On a perdu l'Elfe... Enfin le bon côté c'est qu'il y a plus de silence."
TUTO_FLOOR_2_ELF_DEAD_2=\nOgre : "Miam ?"

TUTO_FLOOR_3_INTRO_1=\nRanger : "Un cul de sac ?! C'est pas possible, il y a forcément un passage secret !"
TUTO_FLOOR_3_INTRO_2=\nElfe : "Je crois avoir vu une brique dépasser par là..."
TUTO_FLOOR_3_INTRO_3=\nVoleur : "Laisse-moi faire, c'est mon rayon."
TUTO_FLOOR_3_INTRO_4=\n*Le Voleur rejoint le groupe.*

ITEM_PICKUP=\nLe groupe obtient : %s !
INVENTORY_FULL=\nJe crois que le Nain essaye encore de porter trop d'objets !
ITEM_LEAVE=\nVous laissez le coffre intact.

HUB_INTRO=\nL'air frais ! Vous avez survécu et établi un petit campement !\nLes escaliers au Nord mènent à la Taverne, ceux au Sud vous renvoient au Donjon.