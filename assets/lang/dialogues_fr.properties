# Tutoriel - Etage 1
TUTO_FLOOR_1_INTRO_1=\n=== CHAPITRE 0 : Fuite de la taverne ===
TUTO_FLOOR_1_INTRO_2=Ranger : Aïe... J'ai un mal de crâne effroyable...
TUTO_FLOOR_1_INTRO_3=Ranger : Où est-ce que je suis ? J'étais tellement occupé à courir que je me suis perdu ! Je dois retrouver les autres !
TUTO_FLOOR_1_INTRO_4=Utilisez Z, Q, S, D (ou les flèches) pour vous déplacer dans le couloir.
TUTO_FLOOR_1_INTRO_5=Atteignez l'escalier au bout du chemin pour avancer.

# Tutoriel - Etage 2
TUTO_FLOOR_2_ELF_DEAD_1=Ranger : Hé l'Elfe, lève-toi, on doit sortir d'ici.
TUTO_FLOOR_2_ELF_DEAD_2=Elfe : *gémissement* J'ai trop mal à la tête... je peux à peine marcher.
TUTO_FLOOR_2_ELF_DEAD_3=Ranger : Bon, rejoins le groupe, mais il va falloir te rafistoler avant qu'on bouge d'ici.
TUTO_FLOOR_2_ELF_WOUNDED=\nL'Elfe est trop blessée pour avancer. Appuyez sur ECHAP pour ouvrir le menu, allez dans SAC, et utilisez la Potion de Soin sur l'Elfe.
TUTO_FLOOR_2_ELF_HEALED_1=Elfe : *tousse* Berk ! Ça a un goût de jus de chaussette ! Mais je me sens mieux.

# Tutoriel - Etage 3
TUTO_FLOOR_3_INTRO_1=Voleur : Chuuut ! Restez dans l'ombre ! On ne voit rien avec ce brouillard...
TUTO_FLOOR_3_INTRO_2=Voleur : Il y a une patrouille d'Orques Géants juste devant. Ils sont trop nombreux !
TUTO_FLOOR_3_INTRO_3=Ranger : Comment on passe alors ?
TUTO_FLOOR_3_INTRO_4=Voleur : On va utiliser la Ruse !
TUTO_FLOOR_3_INTRO_5=[UI Tuto] : Avancez pour dissiper le brouillard de guerre.
TUTO_FLOOR_3_INTRO_6=[UI Tuto] : La Minimap en haut à droite affiche les ennemis en rouge. Évitez-les !
TUTO_FLOOR_3_INTRO_7=[UI Tuto] : Si un combat inévitable se déclenche, utilisez la commande [Fuir] !

# Tutoriel - Etage 4
TUTO_FLOOR_4_OGRE_1=Ogre : Chprouk ! Grrrumph !
TUTO_FLOOR_4_MAGI_1=Magicienne : Non, tu ne peux pas le manger ! Écoutez-moi, bande de rustres, mes réserves d'énergie astrale sont complètement épuisées et ma robe est pleine de poussière. Il nous faut faire une pause !
TUTO_FLOOR_4_RANGER_1=Ranger : Il faut qu'on fasse le point sur notre situation stratégique, on ne sait pas ce qui nous attend au bout de ce couloir.
TUTO_FLOOR_4_ELF_1=Elfe : C'est quoi la stratélique ?
TUTO_FLOOR_4_RANGER_2=Ranger : Misère...
TUTO_FLOOR_4_SYS_1=\n[La Magicienne et l'Ogre rejoignent le groupe !]
TUTO_FLOOR_4_MAGI_2=Magicienne : N'oubliez pas, si vous voulez consulter notre équipement ou nos compétences, appuyez sur ECHAP pour ouvrir le menu principal !
TUTO_FLOOR_4_MAGI_3=Magicienne : Vous pouvez aussi y effectuer une Sauvegarde Rapide, mais attention, cela interrompra notre exploration !

